name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Com a URL definida, a suíte usa o serviço acima em vez de subir um
      # container própria conta (testcontainers).
      MONGODB_URL_TEST: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Cache do ambiente
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Ruff
        run: poetry run ruff check .

      - name: Pytest com cobertura
        run: poetry run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Publicar cobertura no resumo do job
        if: always()
        run: |
          echo "### Cobertura — Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          poetry run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Enviar para o Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: docker build -t store-api:ci .
